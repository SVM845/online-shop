<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop — Nexora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="site-header">
        <a class="logo" href="index.html">NEXORA<span>.</span></a>
        <nav class="nav"><a href="index.html">Home</a><a class="active" href="shop.html">Shop</a><a
                href="index.html#featured">Featured</a><a href="index.html#about">About</a></nav>
        <a class="cart-link" href="cart.html">Cart <span class="cart-count">0</span></a>
    </header>

    <main>
        <section class="shop-head">
            <p class="eyebrow">THE COLLECTION</p>
            <h1>Find your next<br><em>favorite.</em></h1>
        </section>
        <section class="shop-layout">
            <aside class="filters">
                <div class="search-box"><input id="search" type="search" placeholder="Search products..."></div>
                <div class="filter-group">
                    <p>Category</p><button class="filter active" data-category="All">All</button><button class="filter"
                        data-category="Audio">Audio</button><button class="filter"
                        data-category="Gaming">Gaming</button><button class="filter"
                        data-category="Desk">Desk</button><button class="filter"
                        data-category="Peripherals">Peripherals</button>
                </div>
                <div class="filter-group">
                    <p>Sort</p><select id="sort">
                        <option value="featured">Featured</option>
                        <option value="low">Price: Low to high</option>
                        <option value="high">Price: High to low</option>
                        <option value="name">Name</option>
                    </select>
                </div>
            </aside>
            <section class="shop-results">
                <div class="results-bar"><span id="result-count"></span></div>
                <div class="product-grid" id="shop-products"></div>
                <p class="empty" id="empty-state" hidden>No products match your search.</p>
            </section>
        </section>
    </main>

    <footer>
        <div><a class="logo" href="index.html">NEXORA<span>.</span></a>
            <p>Tech, refined.</p>
        </div>
        <p>© 2026 Nexora</p>
    </footer>
    <script src="js/products.js"></script>
    <script src="js/app.js"></script>
    <script src="js/shop.js"></script>
</body>

</html>
