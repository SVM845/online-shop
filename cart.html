<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart — Nexora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="site-header">
        <a class="logo" href="index.html">NEXORA<span>.</span></a>
        <nav class="nav"><a href="index.html">Home</a><a href="shop.html">Shop</a><a
                href="index.html#featured">Featured</a><a href="index.html#about">About</a></nav>
        <a class="cart-link active" href="cart.html">Cart <span class="cart-count">0</span></a>
    </header>
    <main>
        <section class="cart-head">
            <p class="eyebrow">YOUR SELECTION</p>
            <h1>Your cart.</h1>
        </section>
        <section class="cart-layout">
            <div id="cart-items"></div>
            <aside class="summary">
                <p class="eyebrow">ORDER SUMMARY</p>
                <div><span>Subtotal</span><strong id="subtotal">$0.00</strong></div>
                <div><span>Shipping</span><strong id="shipping">—</strong></div>
                <div class="summary-total"><span>Total</span><strong id="total">$0.00</strong></div>
                <button class="button checkout" id="checkout">Checkout <span>→</span></button>
                <small>Free shipping on orders over $100.</small>
            </aside>
        </section>
    </main>
    <footer>
        <div><a class="logo" href="index.html">NEXORA<span>.</span></a>
            <p>Tech, refined.</p>
        </div>
        <p>© 2026 Nexora</p>
    </footer>
    <script src="js/products.js"></script>
    <script src="js/app.js"></script>
    <script src="js/cart.js"></script>
</body>

</html>
